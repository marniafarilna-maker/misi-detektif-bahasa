
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cara Bermain - Misi Detektif Bahasa</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("background-detektif.jpg");
background-size: cover;
background-position: center;
background-repeat: no-repeat;
background-attachment: fixed;
            text-align: center;
            padding: 30px 15px;
            margin: 0;
        }

        .panduan {
            background: rgba(230, 215, 250, 0.90);
            max-width: 650px;
            margin: auto;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 8px 25px #0002;
        }

        h1 { color: #6943aa; }

        .langkah {
            background: #f4eeff;
            padding: 15px;
            margin: 12px 0;
            border-radius: 15px;
            text-align: left;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            background: #8064d8;
            color: white;
            padding: 15px 25px;
            border-radius: 15px;
            text-decoration: none;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="panduan">
        <h1>🔎 CARA BERMAIN</h1>
        <p>Selamat datang, Detektif Bahasa!</p>

        <div class="langkah">🕵️ 1. Masukkan nama detektif anda.</div>
        <div class="langkah">📚 2. Baca nota sebelum memulakan setiap misi.</div>
        <div class="langkah">✏️ 3. Jawab 5 soalan bagi setiap misi.</div>
        <div class="langkah">🏅 4. Selesaikan keempat-empat misi.</div>
        <div class="langkah">🏆 5. Kumpulkan markah dan dapatkan lencana!</div>

        <a href="index.html">🏠 KEMBALI KE MENU UTAMA</a>
